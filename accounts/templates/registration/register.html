{% extends "learning_logs/base.html" %}
{% load bootstrap3 %}

{% block header %}
  <h2>Register an account.</h2>
{% endblock header %}

{% block content %}
  <form method="post" action="{% url 'accounts:register' %}" class="form">
    {% csrf_token %}
    {% bootstrap_form form %}
    {% buttons %}
      <button name="submit" class="btn btn-primary">register</button>
    {% endbuttons %}
  </form>
{% endblock content %}
