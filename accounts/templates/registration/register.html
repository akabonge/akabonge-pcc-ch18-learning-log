{% extends "learning_logs/base.html" %}
{% load django_bootstrap5 %}

{% block header %}
  <h2>Register an account.</h2>
{% endblock header %}

{% block content %}
  <form method="post" action="{% url 'accounts:register' %}" class="form">
    {% csrf_token %}
    {% bootstrap_form form %}
      <button name="submit" class="btn btn-primary">register</button>
  </form>
{% endblock content %}
